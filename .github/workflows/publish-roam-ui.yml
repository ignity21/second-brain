name: Publish org-roam-ui

on:
  push:
    branches: [master]
    paths:
      - "roamnotes-v2/**"
      - "publish/**"
      - ".github/workflows/publish-roam-ui.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Commit of ignity21/org-roam-ui (`static` branch) to build.
  ORG_ROAM_UI_REF: ebde001da92d5192fc9624fbc9eb63309b437a18

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Checkout org-roam-ui
        uses: actions/checkout@v7
        with:
          repository: ignity21/org-roam-ui
          ref: ${{ env.ORG_ROAM_UI_REF }}
          path: .org-roam-ui

      - uses: purcell/setup-emacs@v8.0
        with:
          version: "30.1"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: yarn
          cache-dependency-path: .org-roam-ui/yarn.lock

      - name: Install org-roam-ui dependencies
        working-directory: .org-roam-ui
        run: yarn install --frozen-lockfile --ignore-engines

      - name: Build site
        run: publish/build.sh .org-roam-ui site
        env:
          # Served from the root of the custom domain roam.ignity.xyz.
          BASE_PATH: ""

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
