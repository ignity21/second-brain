[tool.poetry]
name = "notebooks"
version = "0.1.0"
description = "Notebooks"
authors = ["chrischen <chrischen3121@gmail.com>"]

[[tool.poetry.source]]
name = "tsinghua"
default = true
url = "https://pypi.tuna.tsinghua.edu.cn/simple"

[tool.poetry.dependencies]
python = "^3.10"
pandas = "^1.4.4"
jupyterlab = "^3.4.6"
scikit-learn = "^1.1.2"
seaborn = "^0.12.0"
debugpy = "1.6.2" # Invalid hashes for 1.6.3
numpy = "^1.23.3"
jupyterthemes = "^0.20.0"
akshare = "^1.7.43"
matplotlib = "^3.6.0"
plotly = "^5.10.0"
dash = "^2.6.2"
ta-lib = "^0.4.25"
yfinance = "^0.1.77"
pysocks = "^1.7.1"
requests = "^2.28.1"
tensorflow = "^2.10.0"
tensorflow-io-gcs-filesystem = { version = "^0.27.0", python = ">=3.10,<3.11" }

[tool.poetry.dev-dependencies]
ipython = "^8.5.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
