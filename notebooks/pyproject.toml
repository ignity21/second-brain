[project]
name = "notebooks"
version = "0.2.0"
description = "Notebooks"
authors = [
    { name = "chrischen", email = "chrischen@ignity.xyz" },
]
requires-python = ">=3.14"
dependencies = [
    "pandas>=2.2.1",
    "jupyterlab>=4.1.5",
    "scikit-learn>=1.4.0",
    "seaborn>=0.13.2",
    "numpy>=1.26.4",
    "jupyterthemes>=0.20.0",
    "akshare>=1.13.17",
    "matplotlib>=3.8.3",
    "ipython>=8.23.0",
    "rich[jupyter]",
    # "ta-lib>=0.4.28", # need to install ta-lib first
    # "plotly>=5.20.0",
    # "dash>=2.16.1",
    # "yfinance>=0.1.77",
    # "pyzmq>=25.1.0",
    # "tensorflow>=2.10.0",
    # "tensorflow-io-gcs-filesystem>=0.27.0",
    "polars>=1.43.2",
    "plotly>=6.9.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pypimirror"
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
